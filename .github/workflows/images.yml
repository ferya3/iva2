name: Container images

# Builds the four server images on GitHub's machines and publishes them to
# ghcr.io/<owner>/<repo>:<component>-<commit sha>, where the commit is the last
# one that changed an image input (infrastructure/docker/image-inputs.txt).
# scripts/install.sh pulls these instead of building on the server; pushes
# that change only docs or scripts reuse the existing images.
on:
  push:
    branches: [main, claude/kind-maxwell-ibgtgr]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            file: infrastructure/docker/api.Dockerfile
            target: api
            build-args: ''
          - component: worker
            file: infrastructure/docker/api.Dockerfile
            target: worker
            build-args: ''
          - component: clinic-web
            file: infrastructure/docker/frontend.Dockerfile
            target: runtime
            build-args: APP=clinic-web
          - component: admin-web
            file: infrastructure/docker/frontend.Dockerfile
            target: runtime
            build-args: APP=admin-web
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Image tag
        id: tag
        run: |
          mapfile -t inputs < infrastructure/docker/image-inputs.txt
          sha="$(git log -1 --format=%H -- "${inputs[@]}")"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ matrix.component }}-$sha"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Already published?
        id: exists
        run: |
          if docker buildx imagetools inspect "${{ steps.tag.outputs.image }}" >/dev/null 2>&1; then
            echo "Already published: ${{ steps.tag.outputs.image }}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and push
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ steps.tag.outputs.image }}
            ghcr.io/${{ github.repository }}:${{ matrix.component }}-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.tag.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
