name: Container images

# Builds the four server images on GitHub's machines and publishes them to
# ghcr.io/<owner>/<repo>:<component>-<commit sha>. scripts/install.sh pulls
# the images of the commit it installs instead of building on the server.
on:
  push:
    branches: [main, claude/kind-maxwell-ibgtgr]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: api
            file: infrastructure/docker/api.Dockerfile
            target: api
            build-args: ''
          - component: worker
            file: infrastructure/docker/api.Dockerfile
            target: worker
            build-args: ''
          - component: clinic-web
            file: infrastructure/docker/frontend.Dockerfile
            target: runtime
            build-args: APP=clinic-web
          - component: admin-web
            file: infrastructure/docker/frontend.Dockerfile
            target: runtime
            build-args: APP=admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ matrix.component }}-${{ github.sha }}
            ghcr.io/${{ github.repository }}:${{ matrix.component }}-latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
