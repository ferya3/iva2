appId: ir.cognitest.player
productName: Cognitest
copyright: Copyright © Cognitest
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
asar: true
# All code is bundled by electron-vite; nothing to rebuild or copy from node_modules.
npmRebuild: false
nodeGypRebuild: false
protocols:
  - name: Cognitest
    schemes: [cognitest]
win:
  target:
    - target: nsis
      arch: [x64]
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD in CI (an unsigned build
  # triggers SmartScreen warnings on clinic machines).
  artifactName: Cognitest-Setup-${version}.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  shortcutName: Cognitest
  language: '1065' # Persian
publish: null
