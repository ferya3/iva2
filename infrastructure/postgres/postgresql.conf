# Tuned for the 8 vCPU / 16 GB single-host starter deployment (DB co-located).
listen_addresses = '*'
max_connections = 120
shared_buffers = 3GB
effective_cache_size = 8GB
work_mem = 16MB
maintenance_work_mem = 512MB
wal_level = replica
max_wal_size = 4GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = 500
log_lock_waits = on
password_encryption = scram-sha-256
timezone = 'UTC'
