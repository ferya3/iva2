# Base settings. Memory parameters (shared_buffers, effective_cache_size,
# work_mem, maintenance_work_mem) are passed on the command line, sized to
# the host by scripts/install.sh — see docker-compose.yml.
listen_addresses = '*'
max_connections = 100
wal_level = replica
max_wal_size = 4GB
checkpoint_completion_target = 0.9
random_page_cost = 1.1
effective_io_concurrency = 200
log_min_duration_statement = 500
log_lock_waits = on
password_encryption = scram-sha-256
timezone = 'UTC'
