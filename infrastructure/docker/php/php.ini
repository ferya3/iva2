; Production PHP settings for the Cognitest API.
expose_php = Off
memory_limit = 256M
post_max_size = 4M
upload_max_filesize = 2M
max_execution_time = 60
date.timezone = UTC

; Float → string conversions (incl. PDO parameter binding) must round-trip
; exactly; the default precision=14 silently rounds millisecond timestamps.
precision = -1
serialize_precision = -1

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = tracing
opcache.jit_buffer_size = 64M

session.use_strict_mode = 1
