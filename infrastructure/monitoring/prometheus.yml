# Optional monitoring profile: `docker compose --profile monitoring up -d`
global:
  scrape_interval: 30s
scrape_configs:
  - job_name: postgres
    static_configs: [{ targets: ['postgres-exporter:9187'] }]
  - job_name: redis
    static_configs: [{ targets: ['redis-exporter:9121'] }]
  - job_name: node
    static_configs: [{ targets: ['node-exporter:9100'] }]
