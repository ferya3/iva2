# Cognitest — single-host production stack (Ubuntu 24.04, Docker Compose v2).
#   cp .env.production.example .env.production   # fill secrets
#   docker compose --env-file .env.production up -d --build
# PostgreSQL and Redis are only reachable on the internal network.

name: cognitest

x-api-env: &api-env
  APP_ENV: production
  APP_DEBUG: 'false'
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  # Public URLs; scripts/install.sh sets them for domain or IP mode.
  APP_URL: ${PUBLIC_API_URL:-https://api.cognitest.ir}
  CLINIC_WEB_URL: ${PUBLIC_CLINIC_URL:-https://clinic.cognitest.ir}
  ADMIN_WEB_URL: ${PUBLIC_ADMIN_URL:-https://admin.cognitest.ir}
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_DATABASE: cognitest
  DB_USERNAME: cognitest_app
  DB_PASSWORD: ${COGNITEST_APP_PASSWORD:?required}
  DB_MIGRATION_USERNAME: cognitest
  DB_MIGRATION_PASSWORD: ${COGNITEST_OWNER_PASSWORD:?required}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?required}
  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: array
  LOG_CHANNEL: stderr
  REPORTS_DISK: reports
  FPM_MAX_CHILDREN: ${FPM_MAX_CHILDREN:-24}

x-logging: &logging
  driver: json-file
  options: { max-size: '20m', max-file: '5' }

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?required}
      COGNITEST_OWNER_PASSWORD: ${COGNITEST_OWNER_PASSWORD}
      COGNITEST_APP_PASSWORD: ${COGNITEST_APP_PASSWORD}
    # Memory settings are sized to the host by scripts/install.sh (defaults: 16 GB host).
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-3GB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-8GB}
      - -c
      - work_mem=${PG_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-512MB}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d cognitest']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    deploy: { resources: { limits: { memory: '${PG_MEMORY_LIMIT:-6g}' } } }
    logging: *logging

  redis:
    image: redis:8
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD}',
        '--maxmemory',
        '${REDIS_MAXMEMORY:-1536mb}',
        '--maxmemory-policy',
        'noeviction',
        '--appendonly',
        'yes',
      ]
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 10s
      retries: 10
    environment: { REDIS_PASSWORD: '${REDIS_PASSWORD}' }
    networks: [internal]
    deploy: { resources: { limits: { memory: '${REDIS_MEMORY_LIMIT:-2g}' } } }
    logging: *logging

  # One-shot: migrations as the owner role, then exits.
  migrate:
    image: cognitest/api:${VERSION:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: api
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    environment: *api-env
    command:
      [
        'php',
        'artisan',
        'migrate',
        '--database=pgsql_owner',
        '--force',
        '--seed',
        "--seeder=Database\\Seeders\\DatabaseSeeder",
      ]
    depends_on: { postgres: { condition: service_healthy } }
    networks: [internal]
    restart: 'no'

  api:
    image: cognitest/api:${VERSION:-latest}
    restart: unless-stopped
    environment: *api-env
    volumes:
      - api-public:/var/www/api/public
      - reports:/var/www/api/storage/app/private
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    networks: [internal]
    deploy: { resources: { limits: { cpus: '${API_CPUS:-2}', memory: '${API_MEMORY_LIMIT:-2g}' } } }
    logging: *logging

  horizon:
    image: cognitest/worker:${VERSION:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
      target: worker
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-}
    restart: unless-stopped
    environment: *api-env
    volumes: [reports:/var/www/api/storage/app/private]
    depends_on: [api]
    networks: [internal]
    deploy:
      { resources: { limits: { cpus: '${WORKER_CPUS:-1}', memory: '${WORKER_MEMORY_LIMIT:-2g}' } } }
    logging: *logging

  scheduler:
    image: cognitest/worker:${VERSION:-latest}
    restart: unless-stopped
    environment: *api-env
    command: ['php', 'artisan', 'schedule:work']
    depends_on: [api]
    networks: [internal]
    logging: *logging

  clinic-web:
    image: cognitest/clinic-web:${VERSION:-latest}
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/frontend.Dockerfile,
        args: { APP: clinic-web, NPM_REGISTRY: '${NPM_REGISTRY:-https://registry.npmjs.org}' },
      }
    restart: unless-stopped
    environment:
      COGNITEST_API_URL: http://nginx-internal/api/v1
      COOKIE_SECURE: 'true'
    networks: [internal]
    logging: *logging

  admin-web:
    image: cognitest/admin-web:${VERSION:-latest}
    build:
      {
        context: .,
        dockerfile: infrastructure/docker/frontend.Dockerfile,
        args: { APP: admin-web, NPM_REGISTRY: '${NPM_REGISTRY:-https://registry.npmjs.org}' },
      }
    restart: unless-stopped
    environment:
      COGNITEST_API_URL: http://nginx-internal/api/v1
      COOKIE_SECURE: 'true'
    networks: [internal]
    logging: *logging

  nginx:
    image: nginx:stable
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-cognitest.ir}
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
    ports: ['80:80', '443:443', '8443:8443']
    volumes:
      - ./infrastructure/nginx/templates/${NGINX_MODE:-domain}:/etc/nginx/templates:ro
      - ./infrastructure/nginx/internal.conf:/etc/nginx/conf.d/internal.conf:ro
      - ./infrastructure/nginx/snippets:/etc/nginx/snippets:ro
      - ${TLS_CERT_DIR:-./infrastructure/nginx/certs}:/etc/nginx/certs:ro
      - api-public:/var/www/api/public:ro
    depends_on: [api, clinic-web, admin-web]
    networks:
      edge: {}
      internal: { aliases: [nginx-internal] }
    logging: *logging

  # --- optional: docker compose --profile monitoring up -d -------------------
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    volumes: ['./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro']
    networks: [internal]
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    profiles: [monitoring]
    environment:
      {
        DATA_SOURCE_NAME: 'postgresql://cognitest:${COGNITEST_OWNER_PASSWORD}@postgres:5432/cognitest?sslmode=disable',
      }
    networks: [internal]
  redis-exporter:
    image: oliver006/redis_exporter:v1.74.0
    profiles: [monitoring]
    environment: { REDIS_ADDR: 'redis://redis:6379', REDIS_PASSWORD: '${REDIS_PASSWORD}' }
    networks: [internal]

networks:
  edge: {}
  internal: { internal: true }

volumes:
  pgdata: {}
  redisdata: {}
  reports: {}
  api-public: {}
